# --- 1) In /etc/nginx/nginx.conf, inside the http { } block -------------------
# Combined format + response time + host, so one shared access.log can be split
# per app and latency charts work. The collector also reads plain "combined"
# lines (then latency is simply not shown).
#
#   log_format wallmon '$remote_addr - $remote_user [$time_local] "$request" '
#                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
#                      'rt=$request_time host=$host';
#   access_log /var/log/nginx/access.log wallmon;
#
# (If a site has its own `access_log` line, append ` wallmon` to it too.)

# --- 2) In EVERY app's server { } block ---------------------------------------
# The gem already refuses proxied requests; this keeps the path invisible from
# the internet as a second lock.
#
#   location ^~ /internal/ { return 404; }

# --- 3) In ONE server { } block (any of your sites) ---------------------------
# Serves the collector output to the Raspberry Pi behind basic auth.
# Create the password file once:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/wallmon.htpasswd wallmon
location = /wallmon/status.json {
    alias /var/www/wallmon/status.json;
    auth_basic "wallmon";
    auth_basic_user_file /etc/nginx/wallmon.htpasswd;
    default_type application/json;
    add_header Cache-Control "no-store";
    access_log off;
}
